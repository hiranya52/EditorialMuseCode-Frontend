<div
  class="bg-surface text-on-surface font-body h-screen w-full overflow-hidden flex items-center justify-center relative">

  <!-- 🌄 Background Image Layer -->
  <img class="absolute inset-0 w-full h-full object-cover opacity-20 grayscale-[0.2] z-0"
    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAm3ojEAB-nPrBl1kQCHgQwTXty8UUor_a4OxGFJYaebeoqsdPazVW62cJGIsMHt4Y3gIgxgYl8APn22C_2Wq-ZtCytwVeK3CMg21s9uyjl2hEQyiy_ZeH9924tlEvXfXhg7JP_s_oG0D8C_xqP3vAQ2Gy2xzSDV4hZoL3fR2UwhKWYHSbjjSTz7U4emX7pattW8KR27DFRBg5CSLXPL_Gi_0Z2-nJAj3M6aD1ihgs7Xf7C4GaDMQJdoreiUDkX_cgsp-sgif61tJw"
    alt="background" />

  <!-- Background Decor -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] rounded-full bg-primary-fixed/30 blur-[120px]"></div>
    <div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] rounded-full bg-tertiary-fixed/20 blur-[120px]">
    </div>
  </div>
  <!-- Onboarding Container -->
  <main class="relative z-10 w-full max-w-4xl px-6 h-full flex items-center justify-center">
    <!-- <section class="glass-card w-full max-h-[870px] rounded-[20px] shadow-[0_20px_40px_rgba(28,27,27,0.06)] flex flex-col p-10 md:p-14 border border-white/20"> -->
    <section
      class="glass-card w-full max-w-2xl max-h-162.5 rounded-[18px] shadow-[0_15px_30px_rgba(28,27,27,0.06)] flex flex-col p-6 md:p-8 border border-white/20">
      <!-- Header Section -->
      <div class="text-center mb-6">
        <h1 class="font-headline text-4xl md:text-5xl text-primary font-bold tracking-tight mb-4">
          Personalize Your Feed
        </h1>
        <p class="font-body text-on-surface-variant text-lg max-w-xl mx-auto leading-relaxed">
          Select categories that interest you to curate your experience.
        </p>
      </div>
      <!-- Categories Grid -->
      <div class="category-grid overflow-y-auto grow px-2 mb-10">
        <div class="flex flex-wrap justify-center gap-3 mt-6">

          <div class="flex flex-wrap justify-center gap-3 mt-6">

  @for (category of categories; track category.id) {

    <button
      (click)="toggleCategory(category.id)"
      [ngClass]="isSelected(category.id) ? selectedClass : normalClass">

      <span class="font-label text-sm">
        {{ category.name }}
      </span>

      @if (isSelected(category.id)) {

        <span
          class="material-symbols-outlined text-sm"
          style="font-variation-settings: 'FILL' 1;">

          check_circle

        </span>

      }

    </button>

  }

</div>

        </div>
      </div>
      <!-- Footer Action -->
      <div class="flex flex-col items-center gap-4">
        <button (click)="onSubmit()"
          class="bg-primary text-on-primary font-label text-sm font-bold py-4 px-12 rounded-sm transition-all duration-300 hover:opacity-90 active:scale-95 shadow-lg flex items-center gap-2 group">
          Continue
          <span
            class="material-symbols-outlined text-base group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
        <!-- <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant opacity-50">
          Step 1 of 3
        </p> -->
      </div>
    </section>
  </main>

  <!-- Visual Texture Overlay -->
  <div class="fixed inset-0 pointer-events-none z-50 mix-blend-overlay opacity-10">
    <svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
      </filter>
      <rect filter="url(#noise)" height="100%" width="100%"></rect>
    </svg>
  </div>
</div>
