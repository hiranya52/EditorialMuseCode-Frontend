<div class="max-w-3xl mx-auto">

  <!-- Toolbar -->
  <div class="flex items-center justify-between mb-12 border-b border-outline-variant/10 pb-4">
    <div class="flex items-center gap-4 text-stone-400">

      <button type="button" class="hover:text-primary transition-colors" (click)="formatText('bold')"
        [class.bg-primary]="isBold" [class.text-white]="isBold" class="p-2 rounded transition-colors">
        <span class="material-symbols-outlined">format_bold</span>
      </button>

      <button type="button" class="hover:text-primary transition-colors" (click)="formatText('italic')">
        <span class="material-symbols-outlined">format_italic</span>
      </button>

      <button type="button" class="hover:text-primary transition-colors" (click)="formatText('underline')">
        <span class="material-symbols-outlined">format_underlined</span>
      </button>

      <div class="w-px h-4 bg-outline-variant/30"></div>

      <button type="button" class="hover:text-primary transition-colors" (click)="formatText('insertUnorderedList')">
        <span class="material-symbols-outlined">format_list_bulleted</span>
      </button>

      <button type="button" class="hover:text-primary transition-colors"
        (click)="formatText('formatBlock', 'blockquote')">
        <span class="material-symbols-outlined">format_quote</span>
      </button>

    </div>
  </div>

  <!-- Title -->
  <div class="group mb-10">
    <label class="font-label text-[10px] tracking-[0.2em] uppercase text-stone-400 mb-2 block">
      Article Title
    </label>

    <textarea #titleInput [value]="title" (input)="autoResize(titleInput); onTitleChange($event)" rows="1"
      class="w-full editorial-input font-headline text-5xl md:text-6xl font-bold leading-tight resize-none overflow-hidden placeholder:text-stone-200 py-2"
      placeholder="Start with a title...">
    </textarea>
  </div>

  <!-- Cover Image -->
  <div class="relative group mb-10">

    <input type="file" accept="image/*" class="hidden" #fileInput (change)="onFileSelect($event)">

    <div (click)="fileInput.click()"
      class="cursor-pointer w-full aspect-21/9 bg-surface-container-low border border-dashed border-outline-variant/30 rounded-sm flex flex-col items-center justify-center overflow-hidden">

      @if (!coverImage) {
      <div class="text-center p-8">
        <span class="material-symbols-outlined text-4xl text-stone-300">
          add_a_photo
        </span>

        <p class="font-label text-xs tracking-widest uppercase text-stone-400">
          Add Cover Image
        </p>
      </div>
      }

      @if (coverImage) {
      <img [src]="coverImage" alt="cover" class="w-full h-full object-cover">
      }

    </div>

  </div>

  <!-- Content Editor -->
  <div class="min-h-150">

    <label class="font-label text-[10px] tracking-[0.2em] uppercase text-stone-400 mb-4 block">
      Content Body
    </label>

    <div #contentEditor contenteditable="true"
      class="min-h-[500px] outline-none font-body text-lg leading-relaxed border rounded p-4" (input)="onEditorInput()">
    </div>

  </div>

  <!-- Stats -->
  <div class="mt-10 border-t pt-6">
    <p class="text-sm text-stone-500">
      Words: {{ wordCount }}
      •
      Reading Time: {{ readingTime }} min
    </p>
  </div>

</div>
