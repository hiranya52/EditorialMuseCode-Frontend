<article class="group flex flex-col md:flex-row gap-10">

  <div class="flex-1">

    <div class="flex items-center gap-3 mb-4">
      <img class="w-7 h-7 rounded-full" [src]="article.avatar" />
      <span class="font-semibold">{{ article.author }}</span>
      <span class="text-stone-400">{{ article.date }}</span>
    </div>

    <h2 class="text-3xl font-bold text-primary mb-4 group-hover:text-teal-900">
      {{ article.title }}
    </h2>

    <p class="text-stone-600 mb-6">
      {{ article.description }}
    </p>

    <div class="flex justify-between text-sm text-stone-500">
      <span>{{ article.category }}</span>
      <span>{{ article.readTime }}</span>
    </div>

  </div>

  <img class="w-full md:w-64 h-48 object-cover rounded" [src]="article.image" />

</article>
